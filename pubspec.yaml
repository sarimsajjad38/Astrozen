name: astrozen
description: "AstroZen - AI Powered Astrology App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.8.1

  # State Management
  provider: ^6.1.2

  # UI & Animations
  animate_do: ^3.3.4
  shimmer: ^3.0.0
  lottie: ^3.3.1
  flutter_staggered_animations: ^1.1.1
  smooth_page_indicator: ^1.2.0+3
  percent_indicator: ^4.2.3

  # HTTP & API
  http: ^1.4.0
  dio: ^5.8.0+1

  # Local Storage
  shared_preferences: ^2.5.3

  # Fonts
  google_fonts: ^6.2.1

  # Image & Camera
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  flutter_svg: ^2.1.0
  font_awesome_flutter: ^10.8.0

  # Particles / Custom Painters
  particles_flutter: ^0.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  path_provider_foundation: 2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
